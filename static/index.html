<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>药物警戒案例台</title>
<style>body{font:15px system-ui;max-width:1080px;margin:40px auto;padding:0 20px;background:#f5f7fa;color:#172033}section{background:white;padding:20px;margin:16px 0;border-radius:12px;box-shadow:0 2px 12px #0001}input,textarea,button,select{font:inherit;padding:8px;margin:4px}input,textarea{width:70%}button{background:#174ea6;color:white;border:0;border-radius:6px;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e5e9f0;padding:6px 8px;text-align:left;font-size:13px}pre{background:#111827;color:#d1fae5;padding:14px;overflow:auto}.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:#e8eefc}</style>
<h1>药物警戒案例台</h1><p>标准库 JSON API 概览。请求需带 X-User-Id、X-Role；区域角色还需 X-Region。</p>
<section><h2>快速查看</h2><input id="user" value="global-admin"><input id="role" value="global_admin"><input id="region" placeholder="X-Region（如 CN/US）"><button onclick="load()">刷新案例</button><pre id="out"></pre></section>
<section id="transfer-section"><h2>跨区域移交</h2><div id="transfer-panel"></div></section>
<script src="/static/transfers.js"></script>
<script>async function load(){let h={'X-User-Id':user.value,'X-Role':role.value};if(region.value)h['X-Region']=region.value;let r=await fetch('/api/state',{headers:h});out.textContent=JSON.stringify(await r.json(),null,2);if(window.renderTransfers)renderTransfers(h)}load()</script>
